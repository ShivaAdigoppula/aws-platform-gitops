apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ShivaAdigoppula/aws-platform-gitops.git
    targetRevision: main
    path: manifests/demo-app          # "deploy what's in this folder…"
  destination:
    server: https://kubernetes.default.svc
    namespace: demo                   # "…into the namespace demo…"
  syncPolicy:
    automated:
      prune: true                     # "…delete what's removed from Git…"
      selfHeal: true                  # "…and undo manual changes."
    syncOptions:
      - CreateNamespace=true          # create namespace "demo" if missing