apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 2                              # keep 2 pods running
  selector:
    matchLabels:
      app: demo-app                        # "the pods I manage are the ones labelled app=demo-app"
  template:                                # the blueprint for each pod
    metadata:
      labels:
        app: demo-app
    spec:
      securityContext:
        runAsNonRoot: true                 # refuse to start if the image would run as root
      containers:
        - name: demo-app
          image: demo-app                  # short name: Kustomize swaps in ECR address + newTag
          ports:
            - containerPort: 8000
          env:
            - name: APP_MESSAGE
              value: "Hello from demo-app on EKS (dev)"
          readinessProbe:                  # "ready for traffic?"
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:                   # "still alive? if not, restart me"
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:                      # guaranteed minimum (used for scheduling)
              cpu: 50m
              memory: 64Mi
            limits:                        # hard maximum
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false