apiVersion: v1
kind: Service
metadata:
  name: demo-app
spec:
  type: ClusterIP              # reachable INSIDE the cluster only (no AWS load balancer yet)
  selector:
    app: demo-app              # send traffic to pods with this label
  ports:
    - port: 80                 # the Service's port
      targetPort: 8000         # the container's port